name: Windows adaptive opening test
on:
  push:
permissions:
  contents: read
jobs:
  preview:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt pytest 'pyinstaller>=6.16,<7'
      - run: python scripts/prepare_reference_assets.py
      - run: python -m pytest -q
      - run: python -m pip uninstall -y pytest
      - run: python -m PyInstaller --noconfirm --windowed --name EasyAstroStudio --version-file version_info.txt --add-data "assets;assets" --collect-data pyopencl --hidden-import sep --collect-submodules skimage.transform app.py
      - name: Verify frozen test application
        shell: pwsh
        run: |
          $process = Start-Process -FilePath dist/EasyAstroStudio/EasyAstroStudio.exe -ArgumentList '--smoke-test' -PassThru
          if (-not $process.WaitForExit(120000)) { $process.Kill(); throw 'Test app smoke timed out' }
          if ($process.ExitCode -ne 0) { throw "Test app smoke failed: $($process.ExitCode)" }
          Copy-Item OPENING_PREVIEW_TEST.md dist/EasyAstroStudio/START-HERE.md
      - uses: actions/upload-artifact@v4
        with:
          name: EasyAstroStudio-1.7.1-Opening-Preview-Test
          path: dist/EasyAstroStudio/
          if-no-files-found: error
