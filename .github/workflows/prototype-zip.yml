name: Standalone reference prototype ZIP
on:
  push:
    branches: ['prototype/reference-view-standalone']
permissions:
  contents: read
jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check public reference services
        run: |
          python -m pip install pillow
          python check_services.py
      - name: Browser regression and live NASA image check
        env:
          TEST_LIVE_REFERENCE: '1'
          REFERENCE_SCREENSHOT: Reference-View-Preview.png
        run: |
          google-chrome --headless --no-sandbox --disable-dev-shm-usage --enable-unsafe-swiftshader --use-angle=swiftshader --remote-debugging-port=9233 --user-data-dir="$RUNNER_TEMP/ref-browser" --no-first-run --no-default-browser-check about:blank > "$RUNNER_TEMP/chrome.log" 2>&1 &
          python -m http.server 8133 --bind 127.0.0.1 > "$RUNNER_TEMP/ref-server.log" 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:9233/json > /dev/null; then break; fi
            sleep 1
          done
          if ! curl -fsS http://127.0.0.1:9233/json > /dev/null; then
            cat "$RUNNER_TEMP/chrome.log"
            exit 1
          fi
          node test-reference.mjs
      - name: Verify standalone files
        run: |
          test -s Reference-View-Test.html
          test -s START-HERE.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Easy-Astro-Reference-View-Standalone
          path: |
            Reference-View-Test.html
            START-HERE.txt
            README.md
            THIRD-PARTY-NOTICES.txt
          if-no-files-found: error
