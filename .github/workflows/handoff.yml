name: Combined Apple handoff 1.7.1
on:
  push:
permissions:
  contents: read
jobs:
  handoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: handoff
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: af4e91d5387cd02419d828dd70044ce3cb7fcebc
          path: windows-source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare pinned renderer, licenses and matching source
        run: python windows-source/scripts/prepare_reference_assets.py
      - name: Assemble and verify combined source handoff only
        run: python handoff/package_handoff.py windows-source handoff delivery/EasyAstroStudio-Apple-Combined-Handoff-1.7.1
      - uses: actions/upload-artifact@v4
        with:
          name: EasyAstroStudio-Apple-Combined-Handoff-1.7.1
          path: delivery/EasyAstroStudio-Apple-Combined-Handoff-1.7.1/
          if-no-files-found: error
