name: Windows package
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt pytest 'pyinstaller>=6.16,<7'
      - run: python -m pytest -q
      - name: Remove test runner before freezing runtime
        run: python -m pip uninstall -y pytest
      - run: python -m PyInstaller --noconfirm --windowed --name SeestarStudio --collect-data pyopencl --hidden-import sep --collect-submodules skimage.transform app.py
      - name: Test packaged application
        shell: pwsh
        run: |
          $process = Start-Process -FilePath dist/SeestarStudio/SeestarStudio.exe -ArgumentList '--smoke-test' -PassThru
          if (-not $process.WaitForExit(120000)) { $process.Kill(); throw "Packaged GUI timed out" }
          if ($process.ExitCode -ne 0) { throw "Packaged GUI smoke test failed: $($process.ExitCode)" }
      - name: Build installer
        shell: pwsh
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss'
      - name: Verify Program Files install and desktop shortcut
        shell: pwsh
        run: |
          $setup = Start-Process -FilePath installer/SeestarStudio-0.4.0-Setup.exe -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', '/TASKS=desktopicon' -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw "Installer failed: $($setup.ExitCode)" }
          $installed = Join-Path $env:ProgramFiles 'Seestar Studio/SeestarStudio.exe'
          if (-not (Test-Path $installed)) { throw 'Application missing from native Program Files' }
          $desktop = [Environment]::GetFolderPath('CommonDesktopDirectory')
          if (-not (Test-Path (Join-Path $desktop 'Seestar Studio.lnk'))) { throw 'Desktop shortcut missing' }
          $process = Start-Process -FilePath $installed -ArgumentList '--smoke-test' -PassThru
          if (-not $process.WaitForExit(120000)) { $process.Kill(); throw 'Installed GUI timed out' }
          if ($process.ExitCode -ne 0) { throw "Installed GUI failed: $($process.ExitCode)" }
      - uses: actions/upload-artifact@v4
        with:
          name: SeestarStudio-Windows
          path: |
            installer/*.exe
            dist/SeestarStudio/
