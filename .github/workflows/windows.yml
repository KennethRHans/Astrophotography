name: Windows package
on:
  push:
  workflow_dispatch:
    inputs:
      package_name:
        description: 'Partner Center Package/Identity/Name (blank builds development identity)'
        required: false
        type: string
      publisher:
        description: 'Partner Center Package/Identity/Publisher (CN=...)'
        required: false
        type: string
      publisher_display_name:
        description: 'Partner Center Package/Properties/PublisherDisplayName'
        required: false
        type: string
      display_name:
        description: 'Reserved Store display name'
        required: false
        default: 'Easy Astro Studio'
        type: string
permissions:
  contents: read
  actions: read
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt pytest 'pyinstaller>=6.16,<7'
      - run: python -m pytest -q
      - name: Remove test runner before freezing runtime
        run: python -m pip uninstall -y pytest
      - run: python -m PyInstaller --noconfirm --windowed --name EasyAstroStudio --version-file version_info.txt --add-data "assets;assets" --collect-data pyopencl --hidden-import sep --collect-submodules skimage.transform app.py
      - name: Test packaged application
        shell: pwsh
        run: |
          $process = Start-Process -FilePath dist/EasyAstroStudio/EasyAstroStudio.exe -ArgumentList '--smoke-test' -PassThru
          if (-not $process.WaitForExit(120000)) { $process.Kill(); throw "Packaged GUI timed out" }
          if ($process.ExitCode -ne 0) { throw "Packaged GUI smoke test failed: $($process.ExitCode)" }
      - name: Build and validate development MSIX
        shell: pwsh
        run: ./Build-MSIX.ps1 -TestIdentity
      - name: Install and activate MSIX with real package identity
        shell: pwsh
        run: ./scripts/Test-MSIX.ps1
      - name: Build Store submission candidate with supplied identity
        shell: pwsh
        env:
          STORE_NAME: ${{ inputs.package_name }}
          STORE_PUBLISHER: ${{ inputs.publisher }}
          STORE_PUBLISHER_DISPLAY_NAME: ${{ inputs.publisher_display_name }}
          STORE_DISPLAY_NAME: ${{ inputs.display_name }}
        run: |
          $identity = 'store/identity.json'
          if ($env:STORE_NAME) {
            @{name=$env:STORE_NAME;publisher=$env:STORE_PUBLISHER;publisher_display_name=$env:STORE_PUBLISHER_DISPLAY_NAME;display_name=$env:STORE_DISPLAY_NAME} | ConvertTo-Json | Set-Content store/identity.local.json
            $identity = 'store/identity.local.json'
          }
          ./Build-MSIX.ps1 -IdentityFile $identity
          $package = Get-ChildItem msix-artifacts/submission/*.msix | Select-Object -First 1
          python scripts/verify_msix.py $package.FullName --identity $identity --report msix-artifacts/submission/StorePackageValidation.json
          if ($LASTEXITCODE -ne 0) { throw 'Store archive identity verification failed' }
      - name: Install and activate exact Store identity
        shell: pwsh
        run: ./scripts/Test-MSIX.ps1 -Purpose submission
      - name: Upload Store upload package
        uses: actions/upload-artifact@v4
        with:
          name: EasyAstroStudio-Store-Upload
          path: msix-artifacts/submission/
          if-no-files-found: error
      - name: Upload MSIX artifacts
        uses: actions/upload-artifact@v4
        with:
          name: EasyAstroStudio-MSIX
          path: |
            msix-artifacts/
            store/*.md
            store/identity.example.json
            Build-MSIX.ps1
          if-no-files-found: error
      - name: Build installer
        shell: pwsh
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss'
      - name: Verify Program Files install and desktop shortcut
        shell: pwsh
        run: |
          $setup = Start-Process -FilePath installer/EasyAstroStudio-1.2.0-Setup.exe -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', '/TASKS=desktopicon' -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw "Installer failed: $($setup.ExitCode)" }
          $installed = Join-Path $env:ProgramFiles 'Easy Astro Studio/EasyAstroStudio.exe'
          if (-not (Test-Path $installed)) { throw 'Application missing from native Program Files' }
          $desktop = [Environment]::GetFolderPath('CommonDesktopDirectory')
          if (-not (Test-Path (Join-Path $desktop 'Easy Astro Studio.lnk'))) { throw 'Desktop shortcut missing' }
          $process = Start-Process -FilePath $installed -ArgumentList '--smoke-test' -PassThru
          if (-not $process.WaitForExit(120000)) { $process.Kill(); throw 'Installed GUI timed out' }
          if ($process.ExitCode -ne 0) { throw "Installed GUI failed: $($process.ExitCode)" }
      - name: Fetch previous preview to verify rename upgrade
        uses: actions/download-artifact@v4
        with:
          name: AstroStudioForSeestar-Windows
          path: previous-preview
          run-id: 41379578047
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify upgrade from Astro Studio for Seestar 0.11
        shell: pwsh
        run: |
          $newFolder = Join-Path $env:ProgramFiles 'Easy Astro Studio'
          $uninstall = Start-Process -FilePath (Join-Path $newFolder 'unins000.exe') -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw 'Fresh-install cleanup failed' }
          $old = Start-Process -FilePath previous-preview/installer/AstroStudioForSeestar-0.11.0-Setup.exe -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', '/TASKS=desktopicon' -Wait -PassThru
          if ($old.ExitCode -ne 0) { throw 'Previous preview fixture installation failed' }
          $oldFolder = Join-Path $env:ProgramFiles 'Astro Studio for Seestar'
          $sentinel = Join-Path $oldFolder 'user-image-preservation.txt'
          Set-Content -LiteralPath $sentinel -Value 'Preserve user-created files during rename upgrade'
          $upgrade = Start-Process -FilePath installer/EasyAstroStudio-1.2.0-Setup.exe -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', '/TASKS=desktopicon' -Wait -PassThru
          if ($upgrade.ExitCode -ne 0) { throw 'Rename upgrade failed' }
          $exe = Join-Path $oldFolder 'EasyAstroStudio.exe'
          if (-not (Test-Path $exe)) { throw 'Renamed app missing from previous install directory' }
          if (Test-Path (Join-Path $oldFolder 'AstroStudioForSeestar.exe')) { throw 'Old executable remains' }
          if (-not (Test-Path $sentinel)) { throw 'User-created file was removed' }
          $desktop = [Environment]::GetFolderPath('CommonDesktopDirectory')
          if (Test-Path (Join-Path $desktop 'Astro Studio for Seestar.lnk')) { throw 'Old shortcut remains' }
          if (-not (Test-Path (Join-Path $desktop 'Easy Astro Studio.lnk'))) { throw 'Renamed shortcut missing' }
          $entry = Get-ItemProperty 'HKLM:/Software/Microsoft/Windows/CurrentVersion/Uninstall/Seestar Studio Preview_is1'
          if ($entry.DisplayName -notlike 'Easy Astro Studio*') { throw 'Windows app entry has old name' }
          $process = Start-Process -FilePath $exe -ArgumentList '--smoke-test' -PassThru
          if (-not $process.WaitForExit(120000)) { $process.Kill(); throw 'Upgraded app timed out' }
          if ($process.ExitCode -ne 0) { throw 'Upgraded app failed to start' }
      - uses: actions/upload-artifact@v4
        with:
          name: EasyAstroStudio-Windows
          path: |
            installer/*.exe
            dist/EasyAstroStudio/
