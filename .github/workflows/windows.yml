name: Windows package
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt pytest 'pyinstaller>=6.16,<7'
      - run: python -m pytest -q
      - run: python -m PyInstaller --noconfirm --windowed --name SeestarStudio --collect-all astroalign --collect-all astropy app.py
      - name: Test packaged application
        shell: pwsh
        run: |
          $process = Start-Process -FilePath dist/SeestarStudio/SeestarStudio.exe -ArgumentList '--smoke-test' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Packaged GUI smoke test failed: $($process.ExitCode)" }
      - name: Build installer
        shell: pwsh
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss'
      - uses: actions/upload-artifact@v4
        with:
          name: SeestarStudio-Windows
          path: |
            installer/*.exe
            dist/SeestarStudio/
