name: macOS preview
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    strategy:
      fail-fast: false
      matrix:
        variant: [preview, sandbox]
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt pytest 'pyinstaller>=6.16,<7'
      - name: Compile Metal bridge
        shell: bash
        run: |
          set -o pipefail
          mkdir -p work
          python scripts/build_metal.py 2>&1 | tee work/macos-native.log
      - name: Detect Metal hardware
        id: metal_probe
        run: |
          python - <<'PYCODE'
          import ctypes, os
          from pathlib import Path
          metal = ctypes.CDLL('/System/Library/Frameworks/Metal.framework/Metal')
          metal.MTLCreateSystemDefaultDevice.restype = ctypes.c_void_p
          status = 'available' if metal.MTLCreateSystemDefaultDevice() else 'unavailable'
          Path('work/macos-metal-hardware.log').write_text(status)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('status=' + status + '\n')
          PYCODE
      - name: "Metal device on runner: ${{ steps.metal_probe.outputs.status }}"
        run: echo "GPU numerical tests execute only when Metal hardware is available."
      - name: Run test suite
        env:
          QT_QPA_PLATFORM: offscreen
        shell: bash
        run: |
          set -o pipefail
          mkdir -p work
          python -m pytest -q 2>&1 | tee work/macos-tests.log
      - name: Summarize native test failures
        if: failure()
        id: test_diagnostics
        run: |
          python - <<'PYCODE'
          import os
          from pathlib import Path
          log = Path('work/macos-tests.log')
          if not log.exists():
              log = Path('work/macos-native.log')
          lines = log.read_text().splitlines() if log.exists() else []
          errors = [line.strip() for line in lines if line.startswith('E ') or line.startswith('FAILED ') or 'error:' in line]
          summary = ' | '.join(dict.fromkeys(errors))[:1800]
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('summary=' + summary + '\n')
          PYCODE
      - name: "Native test diagnostics: ${{ steps.test_diagnostics.outputs.summary }}"
        if: failure()
        run: echo "See macOS diagnostics artifact for the complete test log."
      # Astropy's optional plotting imports raise pytest.skip when matplotlib
      # is absent. PyInstaller's isolated hook cannot handle that exception.
      - name: Remove test runner before freezing runtime
        run: python -m pip uninstall -y pytest
      - name: Build macOS app
        shell: bash
        run: |
          set -o pipefail
          mkdir -p work
          if [[ '${{ matrix.variant }}' == sandbox ]]; then
            python scripts/build_macos.py --sandbox 2>&1 | tee work/macos-build.log
          else
            python scripts/build_macos.py 2>&1 | tee work/macos-build.log
          fi
      - name: Test bundled app with native Qt platform
        shell: bash
        run: |
          set -o pipefail
          python - <<'PY' 2>&1 | tee work/macos-smoke.log
          import json
          import subprocess
          from pathlib import Path
          import plistlib
          variant = '${{ matrix.variant }}'
          command = ['dist/EasyAstroStudio.app/Contents/MacOS/EasyAstroStudio', '--smoke-test']
          result = Path('work/macos-smoke.json').resolve()
          result.parent.mkdir(exist_ok=True)
          if variant == 'sandbox':
              signed = subprocess.run(['codesign', '-d', '--entitlements', ':-',
                                       'dist/EasyAstroStudio.app'], capture_output=True, check=True)
              entitlements = plistlib.loads(signed.stdout)
              assert entitlements['com.apple.security.app-sandbox'] is True
              assert entitlements['com.apple.security.files.user-selected.read-write'] is True
              denied = Path('work/unselected-private-file.txt').resolve()
              denied.write_text('sandbox must deny access')
              command += ['--sandbox-probe', str(denied)]
          subprocess.run(command, check=True, timeout=180)
          result.write_text(json.dumps(dict(ok=True, variant=variant)))
          PY
      - name: Summarize packaged failures
        if: failure()
        id: packaged_diagnostics
        run: |
          python - <<'PYCODE'
          import os
          from pathlib import Path
          lines = []
          for name in ('work/macos-build.log', 'work/macos-smoke.log'):
              path = Path(name)
              if path.exists():
                  lines += path.read_text().splitlines()
          selected = [line for line in lines if 'Error:' in line or 'Using CPU:' in line or 'ERROR:' in line or 'Traceback' in line]
          summary = ' | '.join(selected)[-1800:]
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('summary=' + summary + '\n')
          PYCODE
      - name: "Packaged diagnostics: ${{ steps.packaged_diagnostics.outputs.summary }}"
        if: failure()
        run: echo "See build diagnostics for full logs."
      - name: Archive app preserving bundle permissions
        run: ditto -c -k --sequesterRsrc --keepParent dist/EasyAstroStudio.app dist/EasyAstroStudio-macOS-${{ matrix.variant }}.zip
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: EasyAstroStudio-macOS-${{ matrix.variant }}-diagnostics
          path: work/macos-*.log
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: EasyAstroStudio-macOS-${{ matrix.variant }}
          path: |
            dist/EasyAstroStudio-macOS-${{ matrix.variant }}.zip
            work/macos-smoke.json
          if-no-files-found: error
